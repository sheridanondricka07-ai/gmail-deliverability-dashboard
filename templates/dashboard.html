<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!!! GMONITOR FEED v2 !!!</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="feed-layout">
    <header class="feed-header">
        <div class="search-bar-container">
            <input type="text" id="feed-search" placeholder="Search by address, domain, subject or ESP">
        </div>
        <div class="header-actions">
            <button id="manage-btn" class="btn-secondary">Manage Accounts</button>
            <a href="/authorize" class="btn-primary">+ Connect Gmail</a>
        </div>
    </header>

    <main id="feed-container" class="feed-container">
        <div style="text-align: center; padding: 50px; color: #666;">
            <p>Initializing Monitoring Feed...</p>
        </div>
    </main>

    <!-- Manage Modal -->
    <div id="manage-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Connected Accounts</h2>
                <button class="close-modal" style="background:transparent; border:0; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="account-list" class="account-list">
                <!-- List of accounts will be injected here -->
            </div>
        </div>
    </div>

    <script src="/static/js/dashboard.js?v=feed_v1"></script>
</body>
</html>
